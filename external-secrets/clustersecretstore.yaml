# The platform's secret store: group CI/CD variables of servers/pcls.jodywan.com/k8s-1.jodywan.com (group ID 625) on
# the platform GitLab. Only namespaces WITHOUT the Capsule tenant label may use it (tenants have their own stores,
# docs/external-secrets.md). The token is the one by-hand root secret: Secret external-secrets/gitlab-token, key `token`.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gitlab-platform
  labels: {app.kubernetes.io/part-of: external-secrets}
spec:
  conditions:
    - namespaceSelector:
        matchExpressions:
          - {key: capsule.clastix.io/tenant, operator: DoesNotExist}
  provider:
    gitlab:
      url: https://gitlab.jodywan.com
      groupIDs: ["625"]
      auth:
        SecretRef:
          accessToken: {name: gitlab-token, key: token, namespace: external-secrets}
