apiVersion: v1
kind: Service
metadata:
  name: sample-app
  labels: {app.kubernetes.io/name: sample-app}
spec:
  type: ClusterIP            # LoadBalancer, NodePort and ExternalName are refused for tenants
  selector: {app.kubernetes.io/name: sample-app}
  ports:
    - {name: http, port: 80, targetPort: http}
