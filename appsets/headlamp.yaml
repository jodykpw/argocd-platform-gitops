# Headlamp: web UI for the cluster (successor of the archived Kubernetes Dashboard). (layer 1)
# Auto-sync ON (prune OFF). Stateless, no volumes. Login: Authentik OIDC (docs/headlamp.md).
# Before the first sync: apply bootstrap/platform-project.yaml (chart repo in sourceRepos). Argo CD creates the
# namespace; the pod waits (CreateContainerConfigError) until the Secret headlamp-oidc exists: docs/headlamp.md.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: headlamp
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - cluster: k8s-1
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'headlamp'
    spec:
      project: platform
      sources:
        - repoURL: https://kubernetes-sigs.github.io/headlamp/
          chart: headlamp
          targetRevision: "0.45.0"
          helm:
            releaseName: headlamp
            valueFiles:
              - $values/base/headlamp/values.yaml
              - $values/overlays/{{ .cluster }}/headlamp/values.yaml
        - repoURL: https://gitlab.jodywan.com/servers/pcls.jodywan.com/k8s-1.jodywan.com/platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: headlamp
      # The Gateway API server adds defaults to the HTTPRoute (parentRefs group/kind, backendRefs
      # group/kind/weight), which Argo CD shows as OutOfSync although nothing differs.
      ignoreDifferences:
        # Reloader writes the time and cause of its last restart into the pod template (docs/reloader.md).
        - group: apps
          kind: Deployment
          name: headlamp
          jqPathExpressions:
            - .spec.template.metadata.annotations."reloader.stakater.com/last-reloaded-from"
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - .spec.parentRefs[]?.group
            - .spec.parentRefs[]?.kind
            - .spec.rules[]?.backendRefs[]?.group
            - .spec.rules[]?.backendRefs[]?.kind
            - .spec.rules[]?.backendRefs[]?.weight
      syncPolicy:
        automated:
          prune: false        # never delete anything because a file was removed
          selfHeal: false
        retry:
          limit: 10
          backoff: {duration: 15s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
          - RespectIgnoreDifferences=true
        managedNamespaceMetadata:
          labels:
            # the Traefik Gateway listener only accepts routes from namespaces with this label
            gateway-access: platform
            pod-security.kubernetes.io/enforce: baseline
