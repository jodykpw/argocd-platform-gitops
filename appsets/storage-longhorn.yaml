# Longhorn block storage (layer 1, first app).
# Auto-sync ON (after the basic check passed), with prune OFF and no cascade-delete
# finalizer: a removed file or a wrong sync must never delete volumes. selfHeal is off on purpose.
# Chart upgrades: a targetRevision bump syncs automatically, so review every bump in a merge request
# and upgrade one minor version at a time with all volumes healthy.
# Prerequisites on the workers (disk at /mnt/longhorn, iscsi_tcp, multipath): docs/storage-longhorn.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storage-longhorn
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - cluster: k8s-1
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'storage-longhorn'
    spec:
      project: platform
      sources:
        - repoURL: https://charts.longhorn.io
          chart: longhorn
          targetRevision: "1.13.0"
          helm:
            releaseName: longhorn
            valueFiles:
              - $values/base/storage-longhorn/values.yaml
              - $values/overlays/{{ .cluster }}/storage-longhorn/values.yaml
        - repoURL: https://gitlab.jodywan.com/servers/pcls.jodywan.com/k8s-1.jodywan.com/platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: longhorn-system
      syncPolicy:
        automated:
          prune: false        # never delete anything because a file was removed
          selfHeal: false     # Longhorn edits some of its own objects; do not fight it
        retry:
          limit: 10
          backoff: {duration: 15s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
        managedNamespaceMetadata:
          labels:
            # Longhorn needs privileged pods (host access)
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: privileged
            pod-security.kubernetes.io/warn: privileged
      ignoreDifferences:
        # Longhorn injects the conversion webhook CA bundle into its CRDs at runtime.
        # VERIFY on the first sync; remove if Argo CD shows no drift on the CRDs.
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.conversion.webhook.clientConfig.caBundle
