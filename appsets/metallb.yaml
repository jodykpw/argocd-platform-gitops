# MetalLB (layer 0): L2 load balancer for the LAN addresses (Traefik, Capsule Proxy, the LAN Services). Moved here from
# layer0/; the Helm release is the same (rendered output byte-identical). Address pool: appset metallb-config.
# Auto-sync ON, prune OFF. Before the first sync: apply bootstrap/platform-project.yaml (metallb chart repo in sourceRepos).
# First app of a fresh cluster after gateway-api-crds; nothing needs to exist before it. Docs: docs/lan-access-metallb.md.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: metallb
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - cluster: k8s-1
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'metallb'
    spec:
      project: platform
      sources:
        - repoURL: https://metallb.github.io/metallb
          chart: metallb
          targetRevision: "0.16.1"
          helm:
            releaseName: metallb
            valueFiles:
              - $values/base/metallb/values.yaml
              - $values/overlays/{{ .cluster }}/metallb/values.yaml
        - repoURL: https://gitlab.jodywan.com/servers/pcls.jodywan.com/k8s-1.jodywan.com/platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: metallb-system
      syncPolicy:
        automated:
          prune: false        # never delete anything because a file was removed
          selfHeal: false
        retry:
          limit: 10
          backoff: {duration: 15s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
