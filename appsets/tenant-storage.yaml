# Network rules that let a tenant namespace use the platform's Garage S3 API (layer 1). Plain manifests, both sides of the path.
# Plan and test: docs/tenant-storage.md, tests/tenant-storage.sh. Auto-sync ON, prune OFF (tests/tenant-storage.sh passed, 10/10, 2026-10-18).
# Prune stays OFF on purpose: removing a rule from Git must never silently cut a tenant's storage off.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-storage
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - cluster: k8s-1
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'tenant-storage'
    spec:
      project: platform
      source:
        repoURL: https://gitlab.jodywan.com/servers/pcls.jodywan.com/k8s-1.jodywan.com/platform-gitops.git
        targetRevision: main
        path: overlays/{{ .cluster }}/tenant-storage
      destination:
        server: '{{ .server }}'
        namespace: garage
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
        retry:
          limit: 10
          backoff: {duration: 15s, factor: 2, maxDuration: 5m}
        syncOptions:
          - ServerSideApply=true
          - PruneLast=true
