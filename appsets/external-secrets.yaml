# External Secrets Operator (layer 1): fills Kubernetes Secrets from an external store so that Git holds references,
# never values. Backend: GitLab CI/CD variables. Plan, decisions, GitLab setup, tenant model and
# test: docs/external-secrets.md, tests/external-secrets.sh.
# Before the first sync: apply bootstrap/platform-project.yaml (charts.external-secrets.io is in sourceRepos).
# Install order: first layer 1 app after Argo CD (docs/fresh-install-order.md, step 5b). Auto-sync ON, prune OFF. The operator alone changes nothing: no Secret is managed until a store and an
# ExternalSecret exist.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - cluster: k8s-1
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'external-secrets'
    spec:
      project: platform
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: "2.12.0"        # External Secrets v2.12.0
          helm:
            releaseName: external-secrets
            valueFiles:
              - $values/base/external-secrets/values.yaml
              - $values/overlays/{{ .cluster }}/external-secrets/values.yaml
        - repoURL: https://gitlab.jodywan.com/servers/pcls.jodywan.com/k8s-1.jodywan.com/platform-gitops.git
          targetRevision: main
          ref: values
        # The platform's ClusterSecretStore (and later the ExternalSecrets of platform apps live with their apps).
        - repoURL: https://gitlab.jodywan.com/servers/pcls.jodywan.com/k8s-1.jodywan.com/platform-gitops.git
          targetRevision: main
          path: external-secrets
      destination:
        server: '{{ .server }}'
        namespace: external-secrets
      # The cert controller writes the webhook certificate into a Secret and the CA bundle into the webhook
      # configurations and the CRD conversion settings at runtime; Argo CD would show them OutOfSync forever.
      ignoreDifferences:
        - group: ""
          kind: Secret
          jqPathExpressions:
            - .data
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.conversion.webhook.clientConfig.caBundle
      syncPolicy:
        automated:
          prune: false        # never delete a CRD (and every store and ExternalSecret with it) because a file changed
          selfHeal: false
        retry:
          limit: 10
          backoff: {duration: 15s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true      # the CRDs are large
          - SkipDryRunOnMissingResource=true   # ServiceMonitors before Prometheus exists (fresh install, step 5b)
          - PruneLast=true
          - RespectIgnoreDifferences=true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
