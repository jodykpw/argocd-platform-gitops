# Tenant rights on Argo Rollouts: the `Rollout` kind only (a Deployment replacement; its pods are held to the same
# Pod Security, placement and network rules). Aggregated into edit and admin (owners, developers); viewers read.
# NOT given: AnalysisTemplate, ClusterAnalysisTemplate, AnalysisRun, Experiment. Their `web` and `prometheus` providers make
# the controller call any URL, so analysis for tenants needs its own guardrails first (docs/argo-rollouts.md).
# Guardrails: tenant-baseline/argo-rollouts-policy.yaml. Test: tests/argo-rollouts.sh.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-rollouts-edit
  labels:
    app.kubernetes.io/part-of: tenant-guardrails
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-rollouts-view
  labels:
    app.kubernetes.io/part-of: tenant-guardrails
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
