apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refuse-tenant-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: tenant-network-gate
spec:
  podSelector:
    matchExpressions:
      # the Thanos Querier and blackbox-exporter have their own narrower policies
      - {key: app.kubernetes.io/component, operator: NotIn, values: [query]}
      - {key: app.kubernetes.io/name, operator: NotIn, values: [prometheus-blackbox-exporter]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: capsule.clastix.io/tenant, operator: DoesNotExist}
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.233.64.0/18]
        - ipBlock:
            cidr: 10.233.108.128/32     # control-plane-1
        - ipBlock:
