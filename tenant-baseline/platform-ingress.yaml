# Traefik: tenant pods may use the entry points (web 8000, websecure 8443), not the API/dashboard (8080) or metrics (9100).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refuse-tenant-ingress-except-entrypoints
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: tenant-network-gate
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8443}
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: capsule.clastix.io/tenant, operator: DoesNotExist}
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.233.64.0/18]
        - ipBlock:
            cidr: 10.233.108.128/32     # control-plane-1
        - ipBlock:
            cidr: 10.233.101.192/32     # control-plane-2
        - ipBlock:
            cidr: 10.233.89.0/32     # control-plane-3
        - ipBlock:
            cidr: 10.233.84.192/32     # worker-node-1
        - ipBlock:
            cidr: 10.233.83.128/32     # worker-node-2
        - ipBlock:
            cidr: 10.233.108.192/32     # worker-node-3
