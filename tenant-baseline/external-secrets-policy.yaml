# External Secrets for tenants: a tenant may create a namespaced SecretStore that points at ITS OWN
# GitLab project or group on the platform's GitLab (own token in a Secret of its own namespace) and ExternalSecrets that
# use it. What the tenant must NOT be able to do, because the operator is a cluster component with its own network
# access and rights, and a store names the address and the credentials it uses:
#   - use another provider: the `kubernetes` provider would read Secrets of other namespaces through the operator,
#     `fake` and the cloud providers are of no use here and `webhook` calls any address;
#   - point `gitlab.url` anywhere but the platform GitLab (the operator would call internal services: the same
#     reasoning as KEDA triggers, docs/keda.md);
#   - use the platform's ClusterSecretStore (its conditions refuse tenant namespaces too, this is the second lock),
#     or ClusterSecretStore, ClusterExternalSecret, PushSecret and generators at all (no RBAC, controllers off).
# Test: tests/external-secrets.sh. Doc: docs/external-secrets.md. Remove the policies and the RBAC file to turn the
# tenant use off.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-secretstore-gitlab-only
  labels: {app.kubernetes.io/part-of: tenant-guardrails}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["v1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secretstores"]
  variables:
    - name: gitlabUrls
      expression: "['https://gitlab.jodywan.com', 'https://gitlab.jodywan.com/']"
  validations:
    - expression: "has(object.spec.provider) && object.spec.provider.size() == 1 && has(object.spec.provider.gitlab)"
      message: "a tenant SecretStore must use the gitlab provider and no other"
    - expression: "!has(object.spec.provider.gitlab) || (has(object.spec.provider.gitlab.url) && object.spec.provider.gitlab.url in variables.gitlabUrls)"
      message: "the gitlab url of a tenant SecretStore must be https://gitlab.jodywan.com"
    - expression: "!has(object.spec.provider.gitlab) || !has(object.spec.provider.gitlab.auth) || !has(object.spec.provider.gitlab.auth.SecretRef) || !has(object.spec.provider.gitlab.auth.SecretRef.accessToken) || !has(object.spec.provider.gitlab.auth.SecretRef.accessToken.namespace)"
      message: "the access token Secret must be in the namespace of the SecretStore (no namespace field)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-secretstore-gitlab-only
  labels: {app.kubernetes.io/part-of: tenant-guardrails}
spec:
  policyName: tenant-secretstore-gitlab-only
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: capsule.clastix.io/tenant, operator: Exists}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-externalsecret-own-store-only
  labels: {app.kubernetes.io/part-of: tenant-guardrails}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["v1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["externalsecrets"]
  validations:
    - expression: "!has(object.spec.secretStoreRef) || !has(object.spec.secretStoreRef.kind) || object.spec.secretStoreRef.kind == 'SecretStore'"
      message: "a tenant ExternalSecret must use a SecretStore of its own namespace (no ClusterSecretStore)"
    - expression: "!has(object.spec.data) || object.spec.data.all(d, !has(d.sourceRef) || !has(d.sourceRef.storeRef) || !has(d.sourceRef.storeRef.kind) || d.sourceRef.storeRef.kind == 'SecretStore')"
      message: "a tenant ExternalSecret must use a SecretStore of its own namespace (data[].sourceRef.storeRef)"
    - expression: "!has(object.spec.dataFrom) || object.spec.dataFrom.all(d, !has(d.sourceRef) || (!has(d.sourceRef.generatorRef) && (!has(d.sourceRef.storeRef) || !has(d.sourceRef.storeRef.kind) || d.sourceRef.storeRef.kind == 'SecretStore')))"
      message: "a tenant ExternalSecret must use a SecretStore of its own namespace and no generator (dataFrom[].sourceRef)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-externalsecret-own-store-only
  labels: {app.kubernetes.io/part-of: tenant-guardrails}
spec:
  policyName: tenant-externalsecret-own-store-only
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: capsule.clastix.io/tenant, operator: Exists}
