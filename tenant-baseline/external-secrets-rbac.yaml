# Tenant rights on External Secrets: ExternalSecret and SecretStore only (namespaced). Aggregated into the built-in
# edit and admin roles (owners and developers); viewers may read them (a SecretStore holds a reference to the token
# Secret, never the token). No rights on ClusterSecretStore, ClusterExternalSecret, PushSecret or any generator.
# Guardrails: tenant-baseline/external-secrets-policy.yaml. Test: tests/external-secrets.sh.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-external-secrets-edit
  labels:
    app.kubernetes.io/part-of: tenant-guardrails
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-external-secrets-view
  labels:
    app.kubernetes.io/part-of: tenant-guardrails
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch"]
