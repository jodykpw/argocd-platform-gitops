# The ZeedLogic database inside zeedlogic-dev-pg, owned by the role zeedlogic_root (the owner the core seed assigns).
# It starts EMPTY of tables: the core seed is restored into it (by the ZeedLogic chart's seed Job, or by hand, docs/databases.md).
#
# The extensions are declared HERE on purpose, unlike jodywan-dev-pg-zeedlogic.yaml (whose seed was restored by hand as the
# superuser, so the extensions are owned by `postgres`). The chart's seed Job connects as zeedlogic_root, which is not a
# superuser, and PostGIS is not a "trusted" extension, so that Job cannot create it. The operator creates these as the
# superuser instead; the seed's `CREATE EXTENSION IF NOT EXISTS` lines are then no-ops. The order matters:
# postgis_tiger_geocoder needs fuzzystrmatch first. The list is what the core seed itself creates.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: zeedlogic-dev-pg-zeedlogic
  namespace: databases
  labels: {app.kubernetes.io/part-of: databases}
spec:
  name: zeedlogic
  owner: zeedlogic_root
  cluster:
    name: zeedlogic-dev-pg
  extensions:
    - {name: fuzzystrmatch, ensure: present}
    - {name: postgis, ensure: present}
    - {name: postgis_topology, ensure: present}
    - {name: postgis_tiger_geocoder, ensure: present}
    - {name: uuid-ossp, ensure: present}
