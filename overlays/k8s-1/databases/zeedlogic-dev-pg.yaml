# The PostgreSQL database for the zeedlogic tenant's dev environment (zeedlogic-dev): PostGIS, like ZeedLogic needs, the same
# shape as jodywan-dev-pg. One instance: a dev database on a lab cluster, so there is no failover. Raise `instances` for
# anything that must survive a node.
# Image: PostgreSQL 16.9 with PostGIS 3.5.2 (amd64), the same as jodywan-dev-pg, pinned by tag and digest. Update both
# together with that file.
# Storage: `longhorn` keeps two replicas and is Retain (docs/databases.md, section 5).
# No backups are configured yet (docs/cloudnative-pg.md, section 5).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zeedlogic-dev-pg
  namespace: databases
  labels: {app.kubernetes.io/part-of: databases}
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:16-3.5-177@sha256:dba71e1ae5aa91c2cfa4cd4531f2ce2ebeb839293b650414e3bc832c01290bca
  storage:
    size: 10Gi
    storageClass: longhorn
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  bootstrap:
    initdb:
      database: app
      owner: app
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
  monitoring:
    enablePodMonitor: true
  # The role the ZeedLogic core seed expects as the owner of everything (`OWNER TO zeedlogic_root`). The password is in the
  # Secret named here: created by hand in the `databases` namespace, never in Git (docs/databases.md, "A second database").
  managed:
    roles:
      - name: zeedlogic_root
        ensure: present
        login: true
        # The operator fills these two in; leaving them out shows the Cluster OutOfSync in Argo CD for good.
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: zeedlogic-dev-pg-zeedlogic-root
      # Keycloak's own role and database (zeedlogic-dev-pg-keycloak.yaml), so identity data does not share the application's.
      - name: keycloak
        ensure: present
        login: true
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: zeedlogic-dev-pg-keycloak
