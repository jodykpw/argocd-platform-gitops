# Shape of layer0/argocd/patch-secret.yaml, which is NOT in Git (git-ignored). Copy this file to patch-secret.yaml next to
# deploy.sh and put the Authentik client secret of the provider `argocd-oauth-app` in it. deploy.sh adds it to the
# Secret argocd-secret after every install or upgrade.
stringData:
  dex.authentik.clientSecret: "<the Authentik client secret, from Authentik: Applications > Providers>"
