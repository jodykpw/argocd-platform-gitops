# Tenant images may only come from approved registries. The approved list is the Constraint parameter `registries`.
# The registry is the first path segment when it holds a '.' or ':' or is `localhost`; otherwise the image is on Docker
# Hub and counts as `docker.io` (so `nginx:1.27` and `library/nginx:1.27` need `docker.io` in the list). Same rule as the
# Kyverno policy of the same name. Plain v0 Rego, no imports: Gatekeeper refuses `rego.v1`.
# Test: tests/gatekeeper.sh.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: tenantimageregistries
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    description: Images must come from one of the approved registries.
spec:
  crd:
    spec:
      names:
        kind: TenantImageRegistries
      validation:
        openAPIV3Schema:
          type: object
          properties:
            registries:
              description: Approved registry hosts (exact match, port included when the image has one).
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package tenantimageregistries

        containers[c] { c := input.review.object.spec.containers[_] }
        containers[c] { c := input.review.object.spec.initContainers[_] }
        containers[c] { c := input.review.object.spec.ephemeralContainers[_] }

        is_host(h) { contains(h, ".") }
        is_host(h) { contains(h, ":") }
        is_host(h) { h == "localhost" }

        has_host(image) {
          parts := split(image, "/")
          count(parts) > 1
          is_host(parts[0])
        }

        registry(image) = host {
          has_host(image)
          host := split(image, "/")[0]
        }

        registry(image) = "docker.io" {
          not has_host(image)
        }

        approved(host) { host == input.parameters.registries[_] }

        violation[{"msg": msg}] {
          c := containers[_]
          host := registry(c.image)
          not approved(host)
          msg := sprintf("container <%v>: image <%v> comes from <%v>, which is not an approved registry (%v)", [c.name, c.image, host, concat(", ", input.parameters.registries)])
        }
